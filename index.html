<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elegant Cloth Branding</title>
    <style>
        body {
            font-family: 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdfdfd;
            color: #333;
        }
        header {
            background-color: #111;
            color: #fff;
            padding: 20px;
            text-align: center;
            letter-spacing: 2px;
        }
        nav {
            background-color: #222222;
            display: flex;
            justify-content: center;
            padding: 10px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            color: #d4af37; /* elegant gold hover */
        }
        .hero {
            background: url('https://source.unsplash.com/1600x600/?fashion,clothes') no-repeat center center/cover;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
        }
        .hero h1 {
            font-size: 3em;
        }
        .section {
            padding: 50px;
            text-align: center;
        }
        .section h2 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #111;
        }
        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .product {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            width: 250px;
            background-color: #fff;
            transition: transform 0.3s;
        }
        .product:hover {
            transform: scale(1.05);
            border-color: #d4af37;
        }
        footer {
            background-color: #111;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h1>SIAMSELL CLOTHING</h1>
        <p>Style • Classic • Elegance</p>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="hero">
        <a href="https://www.google.com" style="text-decoration: none; color: #3741d4;"><h1>Shop Now</h1></a>
    </div>
    <div class="section">
        <h2>Our Collection</h2>
        <div class="products">
            <div class="product">
                <h3>Classic Tee</h3>
                <p>Soft fabric, timeless design.</p>
            </div>
            <div class="product">
                <h3>Elegant Dress</h3>
                <p>Perfect for every occasion.</p>
            </div>
            <div class="product">
                <h3>Stylish Jacket</h3>
                <p>Modern cut, premium feel.</p>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 SIAMSELL CLOTHING | Designed with Elegance</p>
    </footer>
</body>
</html>
