<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Romantic Proposal</title>
<style>
body {
  background: linear-gradient(270deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
  background-size: 800% 800%;
  animation: bgmove 15s ease infinite;
  height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  overflow: hidden;
  font-family: 'Cursive', sans-serif;
}

@keyframes bgmove {
  0% {background-position:0% 50%}
  50% {background-position:100% 50%}
  100% {background-position:0% 50%}
}

.love-btn {
  font-size: 70px;
  cursor: pointer;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

.click-text {
  margin-top: 10px;
  font-size: 22px;
  color: #fff;
  text-shadow: 0 0 10px rgba(255,0,100,0.8);
}

.arrow {
  font-size: 30px;
  color: #fff;
  animation: bounce 1s infinite;
}

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(10px); }
}

.heart {
  position: absolute;
  font-size: 35px;
  animation: fall 4s linear forwards;
}

@keyframes fall {
  0% { transform: translateY(-50px) translateX(0); opacity: 1; }
  50% { transform: translateY(50vh) translateX(60px) rotate(20deg); }
  100% { transform: translateY(100vh) translateX(-60px) rotate(-20deg); opacity: 0; }
}

.quote {
  margin-top: 30px;
  font-size: 34px;
  color: #fff;
  text-shadow: 0 0 15px rgba(255,0,100,0.9);
  opacity: 0;
  transition: opacity 2s ease-in;
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #ff0066, 0 0 20px #ff3399; }
  to { text-shadow: 0 0 20px #ff66cc, 0 0 30px #ff99cc; }
}
</style>
</head>
<body>
  <div class="love-btn">❤️</div>
  <div class="click-text">Click Me</div>
  <div class="arrow">⬆️</div>
  <div class="quote">Hello my dear Mises😘...I pray for your health, your dreams, your visions...Your Mr. will always stand by you...I LOVE YOU SO MUCH MISES😘🫶🩵</div>

<script>
const loveBtn = document.querySelector('.love-btn');
const quote = document.querySelector('.quote');
const colors = ['red','pink','purple','blue','orange','gold'];
const emojis = ['♥','😘'];

loveBtn.addEventListener('click', () => {
  for(let i=0; i<40; i++){
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.color = colors[Math.floor(Math.random()*colors.length)];
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
  }
  quote.style.opacity = 1;
});
</script>
</body>
</html>
